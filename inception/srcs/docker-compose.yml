services:
  mariadb:
    build: ./requirements/mariadb/
    container_name: mariadb
    image: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress/
    container_name: wordpress
    image: wordpress
    restart: always
    env_file:
      - .env
    volumes:
      - wp-volume:/var/www/html
    depends_on:
      - mariadb
      - redis
    networks:
      - inception
  nginx:
    build: ./requirements/nginx/
    container_name: nginx
    image: nginx
    restart: always
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - wp-volume:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception
  redis:
    build: ./requirements/bonus/redis/
    container_name: redis
    image: redis
    restart: always
    networks:
      - inception

volumes:
  db-volume:
  wp-volume:

networks:
  inception:
    driver: bridge